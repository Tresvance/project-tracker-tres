<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Bleed Square for Safe-Zone Masking -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner Chevrons Scaled into Safe Area -->
  <g filter="url(#shadow)" transform="translate(96, 160) scale(0.8)">
    <path d="M40 30 L112 210 L184 30"
          fill="none"
          stroke="#ffffff"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M216 210 L288 30 L360 210"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
